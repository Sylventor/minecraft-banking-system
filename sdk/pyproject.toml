[project]
name = "horizon-bank-sdk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["certifi==2026.10.19", "httpx==0.28.1", "pydantic==2.11.7"]
[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["horizon_sdk*"]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "respx==0.22.0"]
