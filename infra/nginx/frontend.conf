log_format horizon escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
server {
  listen 80;
  server_tokens off;
  # Resolve the service again after Compose replaces a backend container.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $banking_api backend:8000;
  access_log /var/log/nginx/access.log horizon;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' https:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;
  location ^~ /api/v1/internal/ { return 404; }
  location = /api/v1/support/live {
    proxy_pass http://$banking_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 75s;
    proxy_buffering off;
  }
  location /api/ { proxy_pass http://$banking_api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Request-ID $request_id; client_max_body_size 1m; }
  location / { try_files $uri $uri/ /index.html; }
}
