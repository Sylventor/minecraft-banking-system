name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: horizon}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d horizon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      AUTH_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/horizon
      FINANCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/horizon
      INTERNAL_GRPC_TOKEN: ci-internal-token-with-at-least-32-chars
      API_KEY_PEPPER: ci-api-pepper-with-at-least-32-chars
      DISCORD_BOT_INTERNAL_TOKEN: ci-bot-token-with-at-least-32-chars
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libpqxx-dev libgrpc++-dev protobuf-compiler-grpc libprotobuf-dev libgtest-dev
      - name: Install API dependencies
        run: pip install ./backend[dev] grpcio-tools
      - name: Generate Python gRPC bindings
        run: mkdir -p backend/app/grpc/generated && python -m grpc_tools.protoc -I core/proto --python_out=backend/app/grpc/generated --pyi_out=backend/app/grpc/generated --grpc_python_out=backend/app/grpc/generated core/proto/horizon/banking/v1/banking.proto
      - name: Lint and test Python
        run: cd backend && ruff check app tests && mypy app --exclude generated && pytest
      - name: Test SDK
        run: pip install ./sdk pytest respx && cd sdk && pytest
      - name: Test Discord client state
        run: pip install discord.py==2.6.3 && pytest bot/tests -q
      - name: Audit Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit
      - name: Build and test C++ core
        run: cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure
      - name: Apply clean-database migrations
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          CORE_EXECUTABLE: ${{ github.workspace }}/build/core/horizon-core
        run: python tests/run_integration.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - name: Build and test web
        run: corepack enable && cd frontend && corepack pnpm install --frozen-lockfile && corepack pnpm run typecheck && corepack pnpm test && corepack pnpm run lint && corepack pnpm run build && corepack pnpm audit
      - name: Check public release boundaries
        run: python tools/verify_public_release.py
      - name: Check secrets
        run: python tests/security/scan_secrets.py
      - name: Build service images
        run: docker build -f core/Dockerfile -t horizon-core:ci . && docker build -f backend/Dockerfile -t horizon-api:ci . && docker build -f frontend/Dockerfile -t horizon-web:ci . && docker build -f bot/Dockerfile -t horizon-bot:ci .
