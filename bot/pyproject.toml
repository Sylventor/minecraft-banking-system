[project]
name = "horizon-bank-discord-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["certifi==2026.10.19", "discord.py==2.6.3", "httpx==0.28.1", "pydantic-settings==2.10.1"]
[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-asyncio==1.4.0", "ruff==0.12.10"]
